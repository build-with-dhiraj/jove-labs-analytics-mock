        <a href="#" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border:1px solid transparent;border-radius:8px;font:500 14px/20px var(--font-ui);color:var(--ink-600)" style-hover="background:var(--surface-3)"><i data-lucide="database" style="width:18px;height:18px;color:var(--ink-500)"></i>Complete data</a>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}">
const n = (v) => (v == null ? "" : v.toLocaleString("en-US"));

// institution id, name, parent, TAPV 12M, Labs views 12M, Labs views TM
// Labs views 12M is that institution's Analysis-table plays (Trainer + Trainee).
const BASE = [
  [2179, "Harvard University", "", 486204, 1150, 96],
  [1188, "Karolinska Institutet", "", 312640, 704, 62],
  [2610, "American University of Beirut Medical Center", "American University of Beirut", 208470, 576, 48],
  [1043, "University of Toronto", "", 402180, 414, 36],
  [3320, "Charité Universitätsmedizin Berlin", "", 187300, 96, 22],
  [2044, "University of Ibadan", "", 96420, 306, 26],
  [1502, "National University of Singapore", "", 274300, 48, 4],
  [4102, "Delft University of Technology", "", 158900, 26, 8],
  [2860, "Universidad de Chile", "", 132640, null, null],
  [3475, "University of Cape Town", "", 84120, null, null]
];

const ROWS = BASE.map((r) => {
  const tapv12 = r[3];
  const tm = (x) => Math.round((x / 12) * 1.05);
  const part = (f) => Math.round(tapv12 * f);
  const ebpv12 = part(0.14), epv12 = part(0.36), rpv12 = part(0.52), bpv12 = part(0.12);
  return {
    instId: r[0],
    inst: r[1],
    parent: r[2],
    labs12: n(r[4]),
    labsTm: n(r[5]),
    tapv12: n(tapv12), tapvTm: n(tm(tapv12)),
    ebpv12: n(ebpv12), ebpvTm: n(tm(ebpv12)),
    epv12: n(epv12), epvTm: n(tm(epv12)),
    rpv12: n(rpv12), rpvTm: n(tm(rpv12)),
    bpv12: n(bpv12), bpvTm: n(tm(bpv12))
  };
});

class Component extends DCLogic {
  componentDidMount() { this.hydrateIcons(); }
  componentDidUpdate() { this.hydrateIcons(); }
  componentWillUnmount() { if (this._timer) clearInterval(this._timer); }

  hydrateIcons() {
    const go = () => { try { window.lucide.createIcons(); } catch (e) { /* not ready */ } };
    if (window.lucide) { go(); return; }
    if (this._timer) return;
    this._timer = setInterval(() => {
      if (window.lucide) { clearInterval(this._timer); this._timer = null; go(); }
    }, 200);
  }

  svg(paths, size) {
    return React.createElement(
      "svg",
      { width: size || 16, height: size || 16, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
        strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style: { flex: "none" } },
      paths.map((d, i) => React.createElement("path", { key: i, d: d }))
    );
  }

  renderVals() {
    const col = (header, key, kind, sub) => ({ header: header, key: key, kind: kind, sub: sub });
    return {
      searchWidth: 256,
      icoSearch: this.svg(["M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16z", "m21 21-4.3-4.3"], 18),
      icoChevron: this.svg(["m6 9 6 6 6-6"]),
      icoCalendar: this.svg(["M8 2v4", "M16 2v4", "M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z", "M3 10h18"]),
      rows: ROWS,
      cols: [
        col("Institution ID", "instId", "num"),
        col("Insti. Name", "inst", "name"),
        col("Parent Insti. Name", "parent"),
        col("TAPV 12M", "tapv12", "num", "Sep 25 – Aug 26"),
        col("TAPV TM", "tapvTm", "num", "Aug 2026"),
        col("EBPV 12M", "ebpv12", "num", "Sep 25 – Aug 26"),
        col("EBPV TM", "ebpvTm", "num", "Aug 2026"),
        col("EPV 12M", "epv12", "num", "Sep 25 – Aug 26"),
        col("EPV TM", "epvTm", "num", "Aug 2026"),
        col("RPV 12M", "rpv12", "num", "Sep 25 – Aug 26"),
        col("RPV TM", "rpvTm", "num", "Aug 2026"),
        col("BPV 12M", "bpv12", "num", "Sep 25 – Aug 26"),
        col("BPV TM", "bpvTm", "num", "Aug 2026"),
        col("Labs video plays 12M", "labs12", "num", "Sep 25 – Aug 26"),
        col("Labs video plays TM", "labsTm", "num", "Aug 2026")
      ]
    };
  }
}

</script>
